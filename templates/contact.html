<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Bedrey Palace</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f8f9fa;
}

.contact-header{
    background:#212529;
    color:white;
    text-align:center;
    padding:50px;
}

.contact-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

</style>

</head>

<body>

<div class="contact-header">

<h1>Contact Us</h1>

<p>We are available 24 × 7</p>

</div>

<div class="container py-5">

<div class="row">

<div class="col-lg-6">

<div class="contact-box">

<h3>Contact Information</h3>

<hr>

<p><strong>🏨 Hotel:</strong> Bedrey Palace</p>

<p><strong>📍 Address:</strong> Hyderabad, Telangana, India</p>

<p><strong>📞 Phone:</strong> +91 9876543210</p>

<p><strong>📧 Email:</strong> info@bedreypalace.com</p>

<p><strong>🕒 Open:</strong> 24 Hours</p>

</div>

</div>

<div class="col-lg-6">

<div class="contact-box">

<h3>Send Message</h3>

<hr>

<form>

<input type="text" class="form-control mb-3" placeholder="Your Name">

<input type="email" class="form-control mb-3" placeholder="Your Email">

<input type="text" class="form-control mb-3" placeholder="Subject">

<textarea class="form-control mb-3" rows="5" placeholder="Message"></textarea>

<button class="btn btn-warning w-100">

Send Message

</button>

</form>

</div>

</div>

</div>

</div>

</body>

</html>
